plugins { id 'com.android.application' }

android {
    namespace 'lat.gsports.player'
    compileSdk 37
    defaultConfig {
        applicationId 'lat.gsports.player'
        minSdk 27
        targetSdk 37
        versionCode 10
        versionName '1.7.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'

    // Modern embedded browser engine used only on Android 8.1 at runtime.
    implementation 'org.mozilla.geckoview:geckoview-nightly-omni:159.0.20260924164300'
}
