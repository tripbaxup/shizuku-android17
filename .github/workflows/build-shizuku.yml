name: Build Shizuku Android 17 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname '*.zip' \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q \
            "${{ steps.zip.outputs.zip_file }}" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "ZIP extracted."

      - name: Locate Shizuku project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name gradlew \
            | head -n 1)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the ZIP."

            echo
            echo "Extracted files:"
            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 5 \
              -print \
              | head -300

            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show project contents
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          echo "Project root:"
          pwd

          echo
          ls -la

      - name: Populate Shizuku API module
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          if [ -d api ]; then
            if [ -n "$(find api -mindepth 1 -maxdepth 1 2>/dev/null)" ]; then
              echo "api module already populated."
            else
              echo "api directory is empty. Removing it."
              rm -rf api
            fi
          fi

          if [ ! -d api ]; then
            echo "Downloading Shizuku API..."

            git clone \
              --depth 1 \
              https://github.com/RikkaApps/Shizuku-API.git \
              api
          fi

          echo
          echo "API contents:"
          ls -la api

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Install latest Android command line tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd "$RUNNER_TEMP"

          rm -rf cmdline-tools
          rm -f commandlinetools.zip

          echo "Downloading current Android command line tools..."

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          rm -rf "$SDK/cmdline-tools/latest"
          mkdir -p "$SDK/cmdline-tools/latest"

          mv cmdline-tools/* \
            "$SDK/cmdline-tools/latest/"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Verify sdkmanager
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          echo "sdkmanager:"
          which sdkmanager

          echo
          echo "sdkmanager version:"
          sdkmanager --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses \
            >/dev/null 2>&1 || true

      - name: Show Android 17 SDK packages
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          echo "========================================"
          echo "Searching preview channels for API 37"
          echo "========================================"

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --list \
            --channel=3 \
            > "$RUNNER_TEMP/sdk-packages.txt"

          grep -i -E \
            "cinnamon|android-37|37\.0|api.?37" \
            "$RUNNER_TEMP/sdk-packages.txt" \
            || true

          echo
          echo "========================================"
          echo "Available platform packages"
          echo "========================================"

          grep -E \
            '^[[:space:]]*platforms;' \
            "$RUNNER_TEMP/sdk-packages.txt" \
            | tail -40 \
            || true

      - name: Verify Android 37 package exists
        shell: bash
        run: |
          set -euo pipefail

          SDK_LIST="$RUNNER_TEMP/sdk-packages.txt"

          if ! grep -qE \
            '^[[:space:]]*platforms;android-37[[:space:]]*\|' \
            "$SDK_LIST"; then

            echo "ERROR: platforms;android-37 is not available."

            echo
            echo "Android 37 related entries:"
            grep -i -E \
              'android-37|cinnamon|api.?37' \
              "$SDK_LIST" \
              || true

            exit 1
          fi

          echo "platforms;android-37 is available."

      - name: Detect Android 37 Build Tools
        id: buildtools
        shell: bash
        run: |
          set -euo pipefail

          SDK_LIST="$RUNNER_TEMP/sdk-packages.txt"

          BUILD_TOOLS_PACKAGE="$(
            grep -E \
              '^[[:space:]]*build-tools;37\.' \
              "$SDK_LIST" \
              | sed -E 's/^[[:space:]]*//' \
              | cut -d'|' -f1 \
              | sed -E 's/[[:space:]]+$//' \
              | sort -V \
              | tail -n 1
          )"

          echo "Detected Build Tools:"
          echo "$BUILD_TOOLS_PACKAGE"

          if [ -z "$BUILD_TOOLS_PACKAGE" ]; then
            echo "WARNING: No Build Tools 37.x package detected."
            echo "Falling back to build-tools;36.0.0."

            BUILD_TOOLS_PACKAGE="build-tools;36.0.0"
          fi

          echo "build_tools_package=$BUILD_TOOLS_PACKAGE" \
            >> "$GITHUB_OUTPUT"

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          echo "Installing platform-tools..."

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools"

          echo
          echo "Installing Android 17 API 37..."

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --channel=3 \
            "platforms;android-37"

          echo
          echo "Installing Build Tools:"
          echo "${{ steps.buildtools.outputs.build_tools_package }}"

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --channel=3 \
            "${{ steps.buildtools.outputs.build_tools_package }}"

      - name: Verify Android API 37 installation
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_37="$ANDROID_SDK_ROOT/platforms/android-37"
          ANDROID_JAR="$ANDROID_37/android.jar"

          echo "Installed SDK platforms:"
          find "$ANDROID_SDK_ROOT/platforms" \
            -maxdepth 2 \
            -type f \
            -name android.jar \
            -print \
            || true

          echo
          echo "Android 37 directory:"
          ls -la "$ANDROID_37" || true

          if [ ! -f "$ANDROID_JAR" ]; then
            echo
            echo "=========================================="
            echo "ERROR: Android API 37 installation failed"
            echo "=========================================="
            echo
            echo "Missing:"
            echo "$ANDROID_JAR"

            echo
            echo "Available Android 37 SDK packages:"

            export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

            sdkmanager \
              --sdk_root="$ANDROID_SDK_ROOT" \
              --list \
              --channel=3 \
              | grep -i -E \
                  'android-37|cinnamon|api.?37' \
              || true

            exit 1
          fi

          echo
          echo "========================================"
          echo "ANDROID API 37 VERIFIED"
          echo "========================================"
          echo
          ls -lh "$ANDROID_JAR"

          echo
          echo "Installed Build Tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools" || true

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          chmod +x gradlew

          ./gradlew --version

      - name: Inspect Android build configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          echo "========================================"
          echo "compileSdk / targetSdk"
          echo "========================================"

          grep -RniE \
            'compileSdk|compileSdkVersion|targetSdk|targetSdkVersion' \
            . \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            --include='*.properties' \
            --exclude-dir=.git \
            --exclude-dir=build \
            || true

          echo
          echo "========================================"
          echo "Android Gradle Plugin"
          echo "========================================"

          grep -RniE \
            'com\.android\.tools\.build:gradle|8\.10\.1|9\.1\.1' \
            . \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            --include='*.properties' \
            --exclude-dir=.git \
            --exclude-dir=build \
            || true

      - name: Force compileSdk 37
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          find . \
            -type f \
            \( \
              -name '*.gradle' \
              -o -name '*.gradle.kts' \
              -o -name '*.toml' \
              -o -name '*.properties' \
            \) \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -print0 \
            | xargs -0 -r sed -i \
              -e 's/compileSdk = 36/compileSdk = 37/g' \
              -e 's/compileSdk=36/compileSdk=37/g' \
              -e 's/compileSdk 36/compileSdk 37/g' \
              -e 's/compileSdkVersion 36/compileSdkVersion 37/g' \
              -e 's/compileSdkVersion(36)/compileSdkVersion(37)/g' \
              -e 's/compile_sdk = 36/compile_sdk = 37/g' \
              -e 's/compile_sdk=36/compile_sdk=37/g'

          echo "compileSdk references after patch:"

          grep -RniE \
            'compileSdk|compileSdkVersion|compile_sdk' \
            . \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            --include='*.properties' \
            --exclude-dir=.git \
            --exclude-dir=build \
            || true

      - name: Configure Gradle API 37 compatibility
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          touch gradle.properties

          sed -i \
            '/^android\.suppressUnsupportedCompileSdk=/d' \
            gradle.properties

          printf '\nandroid.suppressUnsupportedCompileSdk=37\n' \
            >> gradle.properties

          echo
          echo "gradle.properties:"
          cat gradle.properties

      - name: Show Gradle projects
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew projects \
            --no-daemon \
            --stacktrace \
            || true

      - name: Show debug build tasks
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew tasks \
            --all \
            --no-daemon \
            | grep -E \
                ':manager:assembleDebug|assembleDebug' \
            || true

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      - name: Build Shizuku debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          echo "Checking for Shizuku manager module..."

          if ./gradlew tasks --all --no-daemon \
              | grep -q ':manager:assembleDebug'; then

            echo
            echo "Building :manager:assembleDebug"

            ./gradlew \
              :manager:assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all

          else

            echo
            echo ":manager:assembleDebug not found."
            echo "Using assembleDebug."

            ./gradlew \
              assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all
          fi

      - name: Find generated APKs
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project_dir }}"

          rm -rf "$GITHUB_WORKSPACE/apk-output"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          COUNT=0

          while IFS= read -r APK; do
            echo "Found APK:"
            echo "$APK"

            BASENAME="$(basename "$APK")"

            DEST="$GITHUB_WORKSPACE/apk-output/$BASENAME"

            if [ -e "$DEST" ]; then
              MODULE="$(
                echo "$APK" \
                  | sed "s#^$PROJECT/##" \
                  | cut -d/ -f1
              )"

              DEST="$GITHUB_WORKSPACE/apk-output/${MODULE}-${BASENAME}"
            fi

            cp "$APK" "$DEST"

            COUNT=$((COUNT + 1))
          done < <(
            find "$PROJECT" \
              -type f \
              -path '*/build/outputs/apk/*' \
              -name '*.apk'
          )

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: Build completed but no APK was found."
            exit 1
          fi

          echo
          echo "Collected $COUNT APK(s)."

      - name: Display APK information
        shell: bash
        run: |
          set -euo pipefail

          echo "APK output:"
          ls -lh "$GITHUB_WORKSPACE/apk-output"

          echo

          for APK in "$GITHUB_WORKSPACE"/apk-output/*.apk; do
            echo "--------------------------------"
            echo "$APK"
            sha256sum "$APK"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shizuku-Android17-Debug-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
