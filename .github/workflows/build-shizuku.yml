name: Build Shizuku Android 17

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk

    steps:
      # ============================================================
      # CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # FIND UPLOADED SOURCE ZIP
      # ============================================================

      - name: Find source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -iname '*.zip' \
            | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No source ZIP found."
            exit 1
          fi

          echo "Source ZIP:"
          echo "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # ============================================================
      # EXTRACT SOURCE
      # ============================================================

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q \
            "${{ steps.source.outputs.zip }}" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 2 \
            -type f \
            | head -50

      # ============================================================
      # LOCATE SHIZUKU PROJECT
      # ============================================================

      - name: Locate Shizuku project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name gradlew \
            | head -n 1)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          PROJECT="$(dirname "$GRADLEW")"

          echo "Project directory:"
          echo "$PROJECT"

          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # RESTORE REAL SHIZUKU API SUBMODULE
      #
      # The uploaded ZIP does not contain the actual git submodule
      # contents, so fetch Shizuku-API directly.
      # ============================================================

      - name: Restore Shizuku API
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          echo "Removing incomplete API directory..."
          rm -rf api

          echo "Cloning Shizuku-API..."

          git clone \
            --depth 1 \
            --branch master \
            https://github.com/RikkaApps/Shizuku-API.git \
            api

          echo
          echo "API modules:"
          find api \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            | sort

          test -d api/aidl
          test -d api/api
          test -d api/shared
          test -d api/provider
          test -d api/rish
          test -d api/server-shared

      # ============================================================
      # CREATE ROOT HIDDEN-API-STUB MODULE
      #
      # Root settings.gradle expects:
      #
      # api/hidden-api-stub
      #
      # Shizuku-API contains demo-hidden-api-stub, which provides
      # the source structure needed here.
      # ============================================================

      - name: Create hidden API stub module
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          if [ ! -d "api/demo-hidden-api-stub" ]; then
            echo "ERROR: api/demo-hidden-api-stub not found."
            exit 1
          fi

          rm -rf api/hidden-api-stub

          cp -a \
            api/demo-hidden-api-stub \
            api/hidden-api-stub

          echo "Created:"
          echo "api/hidden-api-stub"

      # ============================================================
      # FIX HIDDEN API STUB GRADLE FILE
      # ============================================================

      - name: Fix hidden API stub Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          FILE="api/hidden-api-stub/build.gradle"

          python3 <<'PY'
          from pathlib import Path

          p = Path("api/hidden-api-stub/build.gradle")

          if not p.exists():
              raise SystemExit("hidden-api-stub build.gradle missing")

          text = p.read_text()

          lines = text.splitlines()
          result = []

          source = None
          target = None

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("sourceCompatibility"):
                  if "=" in line:
                      source = line.split("=", 1)[1].strip()
                  continue

              if stripped.startswith("targetCompatibility"):
                  if "=" in line:
                      target = line.split("=", 1)[1].strip()
                  continue

              result.append(line)

          if source or target:
              source = source or "JavaVersion.VERSION_21"
              target = target or source

              result.extend([
                  "",
                  "java {",
                  f"    sourceCompatibility = {source}",
                  f"    targetCompatibility = {target}",
                  "}",
              ])

          p.write_text("\n".join(result) + "\n")
          PY

          echo
          echo "hidden-api-stub/build.gradle:"
          cat "$FILE"

      # ============================================================
      # FIX NONEXISTENT HIDDEN API 4.5.0
      #
      # 4.5.0 is NOT published on Maven Central.
      # 4.4.0 is the newest published release.
      # ============================================================

      - name: Fix HiddenApi dependency
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          echo "Before:"
          grep -n \
            "version('hidden-api'" \
            settings.gradle \
            || true

          sed -i \
            "s/version('hidden-api', '4\.5\.0')/version('hidden-api', '4.4.0')/" \
            settings.gradle

          echo
          echo "After:"
          grep -n \
            "version('hidden-api'" \
            settings.gradle

          if grep -q \
            "version('hidden-api', '4.5.0')" \
            settings.gradle; then

            echo "ERROR: HiddenApi 4.5.0 still present."
            exit 1
          fi

      # ============================================================
      # JAVA 21
      # ============================================================

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ============================================================
      # INSTALL CURRENT ANDROID COMMAND LINE TOOLS
      # ============================================================

      - name: Install Android command line tools
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANDROID_SDK_ROOT"

          mkdir -p \
            "$ANDROID_SDK_ROOT/cmdline-tools"

          cd "$RUNNER_TEMP"

          rm -rf cmdline-tools
          rm -f commandlinetools.zip

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          mkdir -p \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          mv \
            cmdline-tools/* \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

          echo \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" \
            >> "$GITHUB_PATH"

          echo \
            "$ANDROID_SDK_ROOT/platform-tools" \
            >> "$GITHUB_PATH"

      # ============================================================
      # ACCEPT SDK LICENSES
      # ============================================================

      - name: Accept Android licenses
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses \
            >/dev/null 2>&1 || true

      # ============================================================
      # INSTALL ANDROID 17 / API 37.0
      # ============================================================

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          echo "Installing Android SDK packages..."

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456"

          echo
          echo "Installed platforms:"
          ls -la "$ANDROID_SDK_ROOT/platforms"

          echo
          echo "Android 37 android.jar:"
          ls -lh \
            "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"

      # ============================================================
      # HANDLE compileSdk = 37
      #
      # AGP requests target hash android-37 while Google's package
      # is currently named android-37.0.
      #
      # Use a symlink instead of physically moving the SDK package.
      # ============================================================

      - name: Create Android 37 compatibility target
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_SDK_ROOT/platforms"

          rm -rf android-37

          ln -s \
            android-37.0 \
            android-37

          echo "Platform layout:"
          ls -la

          test -f android-37/android.jar

      # ============================================================
      # UPGRADE AGP FOR API 37
      # ============================================================

      - name: Upgrade Android Gradle Plugin
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          python3 <<'PY'
          from pathlib import Path

          p = Path("settings.gradle")
          text = p.read_text()

          text = text.replace(
              'id("com.android.application") version "8.10.1"',
              'id("com.android.application") version "9.1.1"'
          )

          text = text.replace(
              'id("com.android.library") version "8.10.1"',
              'id("com.android.library") version "9.1.1"'
          )

          p.write_text(text)
          PY

          echo "AGP configuration:"
          grep -n \
            "com.android" \
            settings.gradle \
            | head -10

      # ============================================================
      # GRADLE 9.3.1
      # ============================================================

      - name: Upgrade Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          sed -i \
            's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' \
            gradle/wrapper/gradle-wrapper.properties

          echo "Gradle wrapper:"
          grep \
            distributionUrl \
            gradle/wrapper/gradle-wrapper.properties

      # ============================================================
      # AGP 9 KOTLIN COMPATIBILITY
      # ============================================================

      - name: Configure Kotlin compatibility
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          touch gradle.properties

          sed -i \
            '/^android\.builtInKotlin=/d' \
            gradle.properties

          sed -i \
            '/^android\.newDsl=/d' \
            gradle.properties

          echo \
            "android.builtInKotlin=false" \
            >> gradle.properties

          echo \
            "android.newDsl=false" \
            >> gradle.properties

          echo
          echo "gradle.properties:"
          cat gradle.properties

      # ============================================================
      # VERIFY CONFIGURATION
      # ============================================================

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          chmod +x gradlew

          echo "================================"
          echo "JAVA"
          echo "================================"

          java -version

          echo
          echo "================================"
          echo "GRADLE"
          echo "================================"

          ./gradlew \
            --version

          echo
          echo "================================"
          echo "HIDDEN API"
          echo "================================"

          grep -n \
            "hidden-api" \
            settings.gradle

          echo
          echo "================================"
          echo "ANDROID SDK"
          echo "================================"

          ls -la \
            "$ANDROID_SDK_ROOT/platforms"

          test -f \
            "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"

          echo
          echo "Environment verification complete."

      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace

      # ============================================================
      # BUILD MANAGER APK
      # ============================================================

      - name: Build Shizuku APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          echo "Building Shizuku Manager debug APK..."

          ./gradlew \
            :manager:assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # FIND APK
      # ============================================================

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.dir }}"
          OUTPUT="$GITHUB_WORKSPACE/apk-output"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"

          echo "Searching for APKs..."

          find \
            "$PROJECT/manager/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            -print

          COUNT=0

          while IFS= read -r APK; do

            NAME="$(basename "$APK")"

            cp \
              "$APK" \
              "$OUTPUT/Shizuku-Android17-${NAME}"

            COUNT=$((COUNT + 1))

          done < <(
            find \
              "$PROJECT/manager/build/outputs/apk" \
              -type f \
              -name '*.apk'
          )

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No manager APK generated."
            exit 1
          fi

          echo
          echo "Final APK:"
          ls -lh "$OUTPUT"

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload Shizuku Android 17 APK
        uses: actions/upload-artifact@v4
        with:
          name: shizuku-android17-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
