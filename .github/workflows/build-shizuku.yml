name: Build Shizuku Android 17 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # FIND ZIP
      # ============================================================

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -iname '*.zip' \
              | head -n 1
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # ============================================================
      # EXTRACT ZIP
      # ============================================================

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q \
            "${{ steps.zip.outputs.zip_file }}" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "ZIP extracted."

          echo
          echo "Extracted tree:"
          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 3 \
            -print \
            | head -200


      # ============================================================
      # LOCATE SHIZUKU
      # ============================================================

      - name: Locate Shizuku project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name gradlew \
              | head -n 1
          )"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ============================================================
      # SHOW PROJECT
      # ============================================================

      - name: Show project contents
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          pwd
          ls -la

          echo
          echo ".gitmodules:"
          cat .gitmodules || true

          echo
          echo "Settings references:"
          grep -RniE \
            'hidden-api-stub|projectDir|include.*api' \
            settings.gradle \
            settings.gradle.kts \
            2>/dev/null \
            || true


      # ============================================================
      # POPULATE EXACT SHIZUKU API SUBMODULE VERSION
      #
      # The Shizuku source currently references API commit:
      #
      # a27f6e4
      #
      # This is IMPORTANT.
      #
      # Do NOT clone latest Shizuku-API master because its module
      # layout has changed and does not match this Shizuku tree.
      # ============================================================

      - name: Populate compatible Shizuku API module
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          API_COMMIT="a27f6e4"

          echo "Using Shizuku API commit:"
          echo "$API_COMMIT"

          rm -rf api

          git clone \
            https://github.com/RikkaApps/Shizuku-API.git \
            api

          cd api

          git fetch \
            --depth 1 \
            origin \
            "$API_COMMIT" \
            || true

          git checkout "$API_COMMIT"

          echo
          echo "API commit:"
          git rev-parse HEAD

          echo
          echo "API directories:"
          find . \
            -maxdepth 2 \
            -type d \
            | sort \
            | head -100


      # ============================================================
      # VERIFY REQUIRED API MODULES
      # ============================================================

      - name: Verify Shizuku API module layout
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          echo "Checking API module structure..."

          find api \
            -maxdepth 2 \
            -type d \
            | sort

          if [ ! -d "api/hidden-api-stub" ]; then
            echo
            echo "========================================"
            echo "ERROR: api/hidden-api-stub IS MISSING"
            echo "========================================"

            echo
            echo "API directories present:"
            find api \
              -maxdepth 2 \
              -type d \
              | sort

            echo
            echo "Shizuku settings references:"
            grep -Rni \
              "hidden-api-stub" \
              . \
              --exclude-dir=.git \
              || true

            exit 1
          fi

          echo
          echo "Required module exists:"
          echo "api/hidden-api-stub"


      # ============================================================
      # JAVA 21
      # ============================================================

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=$JAVA_HOME"
          java -version


      # ============================================================
      # ANDROID COMMAND LINE TOOLS
      # ============================================================

      - name: Install latest Android command line tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd "$RUNNER_TEMP"

          rm -rf cmdline-tools
          rm -f commandlinetools.zip

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          rm -rf "$SDK/cmdline-tools/latest"
          mkdir -p "$SDK/cmdline-tools/latest"

          mv \
            cmdline-tools/* \
            "$SDK/cmdline-tools/latest/"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"


      # ============================================================
      # SDKMANAGER
      # ============================================================

      - name: Verify sdkmanager
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          which sdkmanager
          sdkmanager --version


      # ============================================================
      # LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses \
            >/dev/null 2>&1 || true


      # ============================================================
      # LIST API 37 PACKAGES
      # ============================================================

      - name: Show Android 17 SDK packages
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --list \
            --channel=3 \
            > "$RUNNER_TEMP/sdk-packages.txt"

          echo "Android 37 packages:"
          grep -i -E \
            'platforms;android-37|build-tools;37' \
            "$RUNNER_TEMP/sdk-packages.txt" \
            || true


      # ============================================================
      # DETECT ANDROID 37.0
      # ============================================================

      - name: Detect Android 17 platform
        id: android17
        shell: bash
        run: |
          set -euo pipefail

          SDK_LIST="$RUNNER_TEMP/sdk-packages.txt"

          PLATFORM_PACKAGE="$(
            grep -E \
              '^[[:space:]]*platforms;android-37\.0[[:space:]]*\|' \
              "$SDK_LIST" \
              | sed -E 's/^[[:space:]]*//' \
              | cut -d'|' -f1 \
              | sed -E 's/[[:space:]]+$//' \
              | head -n 1
          )"

          echo "Detected platform:"
          echo "$PLATFORM_PACKAGE"

          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "ERROR: platforms;android-37.0 not found."

            grep -i \
              'platforms;android-37' \
              "$SDK_LIST" \
              || true

            exit 1
          fi

          echo "platform_package=$PLATFORM_PACKAGE" \
            >> "$GITHUB_OUTPUT"


      # ============================================================
      # DETECT BUILD TOOLS
      # ============================================================

      - name: Detect Android 37 Build Tools
        id: buildtools
        shell: bash
        run: |
          set -euo pipefail

          SDK_LIST="$RUNNER_TEMP/sdk-packages.txt"

          BUILD_TOOLS_PACKAGE="$(
            grep -E \
              '^[[:space:]]*build-tools;37\.' \
              "$SDK_LIST" \
              | sed -E 's/^[[:space:]]*//' \
              | cut -d'|' -f1 \
              | sed -E 's/[[:space:]]+$//' \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_PACKAGE" ]; then
            BUILD_TOOLS_PACKAGE="build-tools;36.0.0"
          fi

          echo "Build Tools:"
          echo "$BUILD_TOOLS_PACKAGE"

          echo "build_tools_package=$BUILD_TOOLS_PACKAGE" \
            >> "$GITHUB_OUTPUT"


      # ============================================================
      # INSTALL SDK
      # ============================================================

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools"

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --channel=3 \
            "${{ steps.android17.outputs.platform_package }}"

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --channel=3 \
            "${{ steps.buildtools.outputs.build_tools_package }}"


      # ============================================================
      # VERIFY SDK
      # ============================================================

      - name: Verify Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Installed platforms:"

          find "$ANDROID_SDK_ROOT/platforms" \
            -maxdepth 2 \
            -name android.jar \
            -type f \
            -print \
            || true

          ANDROID_37_DIR="$ANDROID_SDK_ROOT/platforms/android-37.0"

          if [ ! -f "$ANDROID_37_DIR/android.jar" ]; then
            echo "ERROR: API 37.0 android.jar missing."
            exit 1
          fi

          echo
          echo "API 37.0 verified:"
          ls -lh "$ANDROID_37_DIR/android.jar"

          echo
          echo "Build Tools:"
          ls -lah "$ANDROID_SDK_ROOT/build-tools"


      # ============================================================
      # INSPECT EXISTING GRADLE CONFIG
      # ============================================================

      - name: Inspect Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          echo "Gradle wrapper:"

          cat \
            gradle/wrapper/gradle-wrapper.properties \
            || true

          echo
          echo "AGP versions:"

          grep -RniE \
            '8\.10\.1|9\.1\.1|com\.android\.tools\.build:gradle' \
            . \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            --include='*.properties' \
            --exclude-dir=.git \
            --exclude-dir=build \
            || true

          echo
          echo "SDK declarations:"

          grep -RniE \
            'compileSdk|compileSdkVersion|targetSdk|targetSdkVersion' \
            . \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            --include='*.properties' \
            --exclude-dir=.git \
            --exclude-dir=build \
            || true


      # ============================================================
      # UPGRADE AGP
      # ============================================================

      - name: Upgrade Android Gradle Plugin
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          find . \
            -type f \
            \( \
              -name '*.gradle' \
              -o -name '*.gradle.kts' \
              -o -name '*.toml' \
              -o -name '*.properties' \
            \) \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -print0 \
            | xargs -0 -r sed -i \
              's/8\.10\.1/9.1.1/g'


      # ============================================================
      # GRADLE 9.3.1
      # ============================================================

      - name: Upgrade Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          WRAPPER="gradle/wrapper/gradle-wrapper.properties"

          test -f "$WRAPPER"

          sed -i \
            's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' \
            "$WRAPPER"

          cat "$WRAPPER"


      # ============================================================
      # COMPILE SDK 37
      # ============================================================

      - name: Configure compileSdk 37
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          find . \
            -type f \
            \( \
              -name '*.gradle' \
              -o -name '*.gradle.kts' \
              -o -name '*.toml' \
              -o -name '*.properties' \
            \) \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -print0 \
            | xargs -0 -r sed -i \
              -e 's/compileSdk = 36/compileSdk = 37/g' \
              -e 's/compileSdk=36/compileSdk=37/g' \
              -e 's/compileSdk 36/compileSdk 37/g' \
              -e 's/compileSdkVersion 36/compileSdkVersion 37/g' \
              -e 's/compileSdkVersion(36)/compileSdkVersion(37)/g'


      # ============================================================
      # GRADLE WRAPPER
      # ============================================================

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          chmod +x gradlew

          ./gradlew --version


      # ============================================================
      # VERIFY ALL REQUIRED PROJECT DIRECTORIES
      #
      # Gradle 9 refuses to configure included projects whose
      # directories don't exist.
      # ============================================================

      - name: Verify Gradle project directories
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          echo "Checking hidden API stub..."

          test -d api/hidden-api-stub

          echo "api/hidden-api-stub exists."

          echo
          echo "Relevant API modules:"

          find api \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -printf '%f\n' \
            | sort


      # ============================================================
      # SHOW PROJECTS
      # ============================================================

      - name: Show Gradle projects
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew \
            projects \
            --no-daemon \
            --stacktrace


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Shizuku debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          echo "Building Shizuku..."

          ./gradlew \
            :manager:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # FIND APK
      # ============================================================

      - name: Find generated APKs
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project_dir }}"

          rm -rf "$GITHUB_WORKSPACE/apk-output"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          COUNT=0

          while IFS= read -r APK; do

            echo "Found:"
            echo "$APK"

            BASENAME="$(basename "$APK")"

            DEST="$GITHUB_WORKSPACE/apk-output/$BASENAME"

            if [ -e "$DEST" ]; then

              MODULE="$(
                echo "$APK" \
                  | sed "s#^$PROJECT/##" \
                  | cut -d/ -f1
              )"

              DEST="$GITHUB_WORKSPACE/apk-output/${MODULE}-${BASENAME}"

            fi

            cp "$APK" "$DEST"

            COUNT=$((COUNT + 1))

          done < <(
            find "$PROJECT" \
              -type f \
              -path '*/build/outputs/apk/*' \
              -name '*.apk'
          )

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo
          echo "Collected $COUNT APK(s)."


      # ============================================================
      # APK INFO
      # ============================================================

      - name: Display APK information
        shell: bash
        run: |
          set -euo pipefail

          ls -lh "$GITHUB_WORKSPACE/apk-output"

          echo

          for APK in "$GITHUB_WORKSPACE"/apk-output/*.apk; do
            echo "--------------------------------"
            echo "$APK"
            sha256sum "$APK"
          done


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shizuku-Android17-API37-Debug-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
