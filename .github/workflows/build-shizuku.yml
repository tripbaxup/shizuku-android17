name: Build Shizuku Android 17 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # FIND + EXTRACT ZIP
      # ------------------------------------------------------------

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' | head -1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP found."
            exit 1
          fi

          echo "Found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"


      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q \
            "${{ steps.zip.outputs.zip }}" \
            -d "$GITHUB_WORKSPACE/extracted"


      # ------------------------------------------------------------
      # FIND PROJECT
      # ------------------------------------------------------------

      - name: Find Shizuku project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(find "$GITHUB_WORKSPACE/extracted" -type f -name gradlew | head -1)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          PROJECT="$(dirname "$GRADLEW")"

          echo "Project: $PROJECT"
          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"


      # ------------------------------------------------------------
      # FIX API SUBMODULE
      # ------------------------------------------------------------

      - name: Populate Shizuku API
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          if [ ! -d "api/api" ]; then

            echo "Downloading Shizuku API..."

            rm -rf api

            git clone \
              --depth 1 \
              https://github.com/RikkaApps/Shizuku-API.git \
              api

          fi


      # ------------------------------------------------------------
      # FIX HIDDEN API STUB
      # ------------------------------------------------------------

      - name: Fix hidden API stub
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          if [ ! -d "api/hidden-api-stub" ]; then

            echo "Creating hidden-api-stub..."

            cp -a \
              api/demo-hidden-api-stub \
              api/hidden-api-stub

          fi

          test -d api/hidden-api-stub

          echo "hidden-api-stub ready."


      # ------------------------------------------------------------
      # JAVA
      # ------------------------------------------------------------

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      # ------------------------------------------------------------
      # ANDROID SDK TOOLS
      # ------------------------------------------------------------

      - name: Install Android SDK tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd "$RUNNER_TEMP"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -O tools.zip

          unzip -q tools.zip

          mkdir -p "$SDK/cmdline-tools/latest"

          mv \
            cmdline-tools/* \
            "$SDK/cmdline-tools/latest/"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"


      # ------------------------------------------------------------
      # LICENSES
      # ------------------------------------------------------------

      - name: Accept licenses
        shell: bash
        run: |
          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses \
            >/dev/null 2>&1 || true


      # ------------------------------------------------------------
      # INSTALL ANDROID 17 / API 37.0
      #
      # AGP 9.1.1 uses Build Tools 36.0.0 by default.
      # ------------------------------------------------------------

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"


      # ------------------------------------------------------------
      # VERIFY SDK
      # ------------------------------------------------------------

      - name: Verify Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"

          echo "Android 37.0 installed:"
          ls -lh \
            "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"


      # ------------------------------------------------------------
      # UPGRADE AGP 8.10.1 -> 9.1.1
      # ------------------------------------------------------------

      - name: Upgrade Android Gradle Plugin
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          echo "Changing AGP 8.10.1 -> 9.1.1"

          grep -RIl \
            --exclude-dir=.git \
            --exclude-dir=build \
            '8\.10\.1' \
            . \
            | while read -r FILE; do

                echo "Updating $FILE"

                sed -i \
                  's/8\.10\.1/9.1.1/g' \
                  "$FILE"

              done

          echo
          echo "AGP references:"

          grep -Rni \
            --exclude-dir=.git \
            --exclude-dir=build \
            '9\.1\.1' \
            . \
            || true


      # ------------------------------------------------------------
      # GRADLE 9.3.1
      # ------------------------------------------------------------

      - name: Upgrade Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          FILE="gradle/wrapper/gradle-wrapper.properties"

          sed -i \
            's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' \
            "$FILE"

          echo "Gradle wrapper:"
          cat "$FILE"


      # ------------------------------------------------------------
      # COMPILE SDK
      #
      # IMPORTANT:
      # With current AGP, API 37.0 is specified as:
      #
      # compileSdk = 37
      # compileSdkMinor = 0
      #
      # ------------------------------------------------------------

      - name: Configure Android 17 compile SDK
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          # Keep existing compileSdk 37 declarations.
          # Remove our previous compatibility hacks.

          touch gradle.properties

          sed -i \
            '/android\.suppressUnsupportedCompileSdk/d' \
            gradle.properties

          echo
          echo "SDK configuration:"

          grep -RniE \
            'compileSdk|compileSdkVersion' \
            . \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --exclude-dir=.git \
            --exclude-dir=build \
            || true


      # ------------------------------------------------------------
      # PREPARE
      # ------------------------------------------------------------

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          chmod +x gradlew

          ./gradlew --version


      # ------------------------------------------------------------
      # CLEAN
      # ------------------------------------------------------------

      - name: Clean
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace


      # ------------------------------------------------------------
      # BUILD
      # ------------------------------------------------------------

      - name: Build Shizuku
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          echo "Building Shizuku for Android 17..."

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace


      # ------------------------------------------------------------
      # COLLECT APK
      # ------------------------------------------------------------

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.dir }}"
          OUTPUT="$GITHUB_WORKSPACE/apk-output"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"

          COUNT=0

          while IFS= read -r APK; do

            echo "Found APK:"
            echo "$APK"

            NAME="$(basename "$APK")"

            cp \
              "$APK" \
              "$OUTPUT/${COUNT}-${NAME}"

            COUNT=$((COUNT + 1))

          done < <(
            find "$PROJECT" \
              -type f \
              -path '*/build/outputs/apk/*' \
              -name '*.apk'
          )

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No APK generated."
            exit 1
          fi

          echo
          echo "Generated APKs:"
          ls -lh "$OUTPUT"


      # ------------------------------------------------------------
      # UPLOAD
      # ------------------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shizuku-Android17-Debug
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
