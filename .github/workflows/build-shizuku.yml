name: Build Shizuku Android 17

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # FIND ZIP
      # ============================================================

      - name: Find source ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname '*.zip' \
            | head -1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP found."
            exit 1
          fi

          echo "ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # ============================================================
      # EXTRACT
      # ============================================================

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q \
            "${{ steps.zip.outputs.zip }}" \
            -d "$GITHUB_WORKSPACE/extracted"

      # ============================================================
      # FIND PROJECT
      # ============================================================

      - name: Locate project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name gradlew \
            | head -1)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          PROJECT="$(dirname "$GRADLEW")"

          echo "Project: $PROJECT"
          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # API SUBMODULE
      # ============================================================

      - name: Populate Shizuku API
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          if [ ! -d "api/api" ]; then
            rm -rf api

            git clone \
              --depth 1 \
              https://github.com/RikkaApps/Shizuku-API.git \
              api
          fi

      # ============================================================
      # HIDDEN API STUB
      # ============================================================

      - name: Create hidden API stub
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          test -d api/demo-hidden-api-stub

          rm -rf api/hidden-api-stub

          cp -a \
            api/demo-hidden-api-stub \
            api/hidden-api-stub

      # ============================================================
      # FIX HIDDEN API STUB FOR GRADLE 9
      # ============================================================

      - name: Fix hidden API stub for Gradle 9
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          python3 <<'PY'
          from pathlib import Path

          p = Path("api/hidden-api-stub/build.gradle")
          text = p.read_text()

          lines = text.splitlines()
          output = []

          source = None
          target = None

          for line in lines:
              s = line.strip()

              if s.startswith("sourceCompatibility"):
                  if "=" in line:
                      source = line.split("=", 1)[1].strip()
                  else:
                      source = "JavaVersion.VERSION_11"
                  continue

              if s.startswith("targetCompatibility"):
                  if "=" in line:
                      target = line.split("=", 1)[1].strip()
                  else:
                      target = "JavaVersion.VERSION_11"
                  continue

              output.append(line)

          if source or target:
              source = source or "JavaVersion.VERSION_11"
              target = target or source

              output.extend([
                  "",
                  "java {",
                  f"    sourceCompatibility = {source}",
                  f"    targetCompatibility = {target}",
                  "}",
              ])

          p.write_text("\n".join(output) + "\n")
          PY

          echo "hidden-api-stub:"
          cat api/hidden-api-stub/build.gradle

      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Install Android SDK tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/android-sdk"

          rm -rf "$SDK"
          mkdir -p "$SDK/cmdline-tools"

          cd "$RUNNER_TEMP"

          rm -rf cmdline-tools
          rm -f android-tools.zip

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -O android-tools.zip

          unzip -q android-tools.zip

          mkdir -p "$SDK/cmdline-tools/latest"

          mv \
            cmdline-tools/* \
            "$SDK/cmdline-tools/latest/"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      # ============================================================
      # LICENSES
      # ============================================================

      - name: Accept licenses
        shell: bash
        run: |
          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses \
            >/dev/null 2>&1 || true

      # ============================================================
      # ANDROID 17
      # ============================================================

      - name: Install Android 17
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

          test -f \
            "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"

      # ============================================================
      # AGP 9.1.1
      # ============================================================

      - name: Upgrade AGP
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          grep -RIl \
            --exclude-dir=.git \
            --exclude-dir=build \
            '8\.10\.1' \
            . \
            | while read -r FILE; do
                sed -i \
                  's/8\.10\.1/9.1.1/g' \
                  "$FILE"
              done

          echo "AGP updated to 9.1.1"

      # ============================================================
      # GRADLE 9.3.1
      # ============================================================

      - name: Upgrade Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          sed -i \
            's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' \
            gradle/wrapper/gradle-wrapper.properties

      # ============================================================
      # AGP 9 KOTLIN COMPATIBILITY
      #
      # AGP 9 includes Kotlin support.
      # This Shizuku source still applies kotlin-android itself.
      # Disable AGP's built-in Kotlin so the existing project can
      # continue using org.jetbrains.kotlin.android 2.1.21.
      # ============================================================

      - name: Configure AGP 9 Kotlin compatibility
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          touch gradle.properties

          sed -i \
            '/^android\.builtInKotlin=/d' \
            gradle.properties

          sed -i \
            '/^android\.newDsl=/d' \
            gradle.properties

          sed -i \
            '/^android\.suppressUnsupportedCompileSdk=/d' \
            gradle.properties

          echo "android.builtInKotlin=false" \
            >> gradle.properties

          echo "android.newDsl=false" \
            >> gradle.properties

          echo
          echo "gradle.properties:"
          cat gradle.properties

      # ============================================================
      # SHOW IMPORTANT VERSIONS
      # ============================================================

      - name: Show build configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          echo "=============================="
          echo "Java"
          echo "=============================="

          java -version

          echo
          echo "=============================="
          echo "Gradle"
          echo "=============================="

          chmod +x gradlew
          ./gradlew --version

          echo
          echo "=============================="
          echo "Kotlin plugin references"
          echo "=============================="

          grep -RniE \
            'org\.jetbrains\.kotlin|kotlin.android|kotlin-android' \
            . \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            --exclude-dir=.git \
            --exclude-dir=build \
            || true

      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          echo "Building Shizuku..."

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # COLLECT APK
      # ============================================================

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.dir }}"
          OUTPUT="$GITHUB_WORKSPACE/apk-output"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"

          COUNT=0

          while IFS= read -r APK; do

            echo "Found:"
            echo "$APK"

            NAME="$(basename "$APK")"

            cp \
              "$APK" \
              "$OUTPUT/${COUNT}-${NAME}"

            COUNT=$((COUNT + 1))

          done < <(
            find "$PROJECT" \
              -type f \
              -path '*/build/outputs/apk/*' \
              -name '*.apk'
          )

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No APK generated."
            exit 1
          fi

          echo
          echo "APKs:"
          ls -lh "$OUTPUT"

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shizuku-Android17-Debug
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
