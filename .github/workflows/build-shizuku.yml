name: Build Shizuku Android 17 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "${{ steps.zip.outputs.zip_file }}" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "Source extracted."

      - name: Locate Shizuku project
        id: project
        shell: bash
        run: |
          set -e

          GRADLEW="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name gradlew \
            | head -n 1)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Could not find gradlew inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Project root:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show project contents
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          pwd
          ls -la

      - name: Populate Shizuku API module
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          if [ -d api ]; then
            if [ -z "$(find api -mindepth 1 -maxdepth 1 2>/dev/null)" ]; then
              echo "Empty api directory found."
              rm -rf api
            else
              echo "Existing api module already populated."
            fi
          fi

          if [ ! -d api ]; then
            echo "Downloading Shizuku API..."

            git clone \
              --depth 1 \
              https://github.com/RikkaApps/Shizuku-API.git \
              api
          fi

          echo
          echo "API contents:"
          ls -la api

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      #
      # USE A CLEAN SDK INSTEAD OF THE RUNNER'S OLD SDK
      #

      - name: Create clean Android SDK
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/android-sdk/cmdline-tools"

          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Download latest Android command-line tools
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP"

          echo "Downloading latest Google Android command-line tools..."

          curl -fL \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" \
            -o commandlinetools.zip

          rm -rf cmdline-temp
          mkdir cmdline-temp

          unzip -q commandlinetools.zip -d cmdline-temp

          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"

          cp -R \
            cmdline-temp/cmdline-tools/* \
            "$HOME/android-sdk/cmdline-tools/latest/"

          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Verify sdkmanager
        shell: bash
        run: |
          set -e

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          echo "sdkmanager:"
          which sdkmanager

          echo
          echo "Version:"
          sdkmanager --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses >/dev/null 2>&1 || true

      #
      # PRINT THE REAL API 37 PACKAGE NAMES
      #

      - name: Discover Android 17 SDK packages
        shell: bash
        run: |
          set -e

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          echo "======================================="
          echo "ANDROID 17 / API 37 PACKAGES"
          echo "======================================="

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --list \
            --channel=3 \
            | grep -i -E \
              "platforms;android-37|build-tools;37|cinnamon|android-37" \
            || true

      #
      # TRY STABLE FIRST
      #

      - name: Install Android 17 API 37
        shell: bash
        run: |
          set -e

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          echo "Installing platform tools..."
          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools"

          echo
          echo "Installing Android API 37..."

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --channel=3 \
            "platforms;android-37"

          echo
          echo "Finding newest Build Tools 37..."

          BUILD_TOOLS_PACKAGE="$(
            sdkmanager \
              --sdk_root="$ANDROID_SDK_ROOT" \
              --list \
              --channel=3 \
              | grep -oE 'build-tools;37\.[0-9]+\.[0-9]+' \
              | sort -V \
              | tail -n 1
          )"

          echo "Build tools package:"
          echo "$BUILD_TOOLS_PACKAGE"

          if [ -z "$BUILD_TOOLS_PACKAGE" ]; then
            echo "ERROR: No Android 37 Build Tools package found."
            exit 1
          fi

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --channel=3 \
            "$BUILD_TOOLS_PACKAGE"

      - name: Verify Android 17 SDK
        shell: bash
        run: |
          set -e

          echo "SDK root:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "Platforms:"
          find "$ANDROID_SDK_ROOT/platforms" \
            -maxdepth 1 \
            -type d \
            -print || true

          echo
          echo "Build Tools:"
          find "$ANDROID_SDK_ROOT/build-tools" \
            -maxdepth 1 \
            -type d \
            -print || true

          if [ ! -f "$ANDROID_SDK_ROOT/platforms/android-37/android.jar" ]; then
            echo "ERROR: android-37/android.jar is missing."
            exit 1
          fi

          echo
          echo "Android 17 SDK installation looks good."

      #
      # BUILD
      #

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          chmod +x gradlew

          ./gradlew --version

      - name: Show Gradle projects
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew projects \
            --no-daemon \
            --stacktrace || true

      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      - name: Build Shizuku debug APK
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      #
      # COLLECT APK
      #

      - name: Find generated APKs
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project_dir }}"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          COUNT=0

          echo "Searching for generated APK files..."

          while IFS= read -r APK; do
            echo
            echo "Found:"
            echo "$APK"

            BASENAME="$(basename "$APK")"

            cp \
              "$APK" \
              "$GITHUB_WORKSPACE/apk-output/$BASENAME"

            COUNT=$((COUNT + 1))

          done < <(
            find "$PROJECT" \
              -type f \
              -name '*.apk'
          )

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          echo
          echo "Collected $COUNT APK(s)."

      - name: Display APK information
        shell: bash
        run: |
          echo "APK files:"
          ls -lh "$GITHUB_WORKSPACE/apk-output"

          echo

          for APK in "$GITHUB_WORKSPACE"/apk-output/*.apk; do
            echo "======================================="
            echo "$APK"
            sha256sum "$APK"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shizuku-Android17-Debug-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
