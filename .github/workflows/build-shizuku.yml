name: Build Shizuku Android 17

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk

    steps:
      # ------------------------------------------------------------
      # 1. Checkout your GitHub Actions repository
      # ------------------------------------------------------------

      - name: Checkout workflow repository
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. Setup Java
      # setup-java v5 uses Node 24
      # ------------------------------------------------------------

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # ------------------------------------------------------------
      # 3. Verify Java
      # ------------------------------------------------------------

      - name: Verify Java
        shell: bash
        run: |
          set -euxo pipefail

          echo "JAVA_HOME=$JAVA_HOME"
          java -version


      # ------------------------------------------------------------
      # 4. Download Shizuku source WITH SUBMODULES
      #
      # Shizuku's own build instructions require:
      # git clone --recurse-submodules
      # ------------------------------------------------------------

      - name: Download Shizuku source
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf extracted
          mkdir -p extracted

          git clone \
            --recurse-submodules \
            https://github.com/RikkaApps/Shizuku.git \
            extracted/Shizuku-master

          cd extracted/Shizuku-master

          git submodule update \
            --init \
            --recursive

          echo
          echo "Shizuku source downloaded."
          echo

          git rev-parse HEAD

          echo
          echo "Top-level files:"
          ls -lah


      # ------------------------------------------------------------
      # 5. Save Shizuku path
      # ------------------------------------------------------------

      - name: Configure Shizuku path
        shell: bash
        run: |
          set -euxo pipefail

          SHIZUKU_DIR="$GITHUB_WORKSPACE/extracted/Shizuku-master"

          if [ ! -f "$SHIZUKU_DIR/gradlew" ]; then
            echo "ERROR: Shizuku gradlew was not found."
            exit 1
          fi

          echo "SHIZUKU_DIR=$SHIZUKU_DIR" >> "$GITHUB_ENV"

          echo "Shizuku directory:"
          echo "$SHIZUKU_DIR"


      # ------------------------------------------------------------
      # 6. Install CURRENT Android command-line tools
      # ------------------------------------------------------------

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euxo pipefail

          SDK_ROOT="$ANDROID_SDK_ROOT"

          CMDLINE_VERSION="15859902"

          echo "Preparing Android SDK..."

          mkdir -p "$SDK_ROOT"

          rm -rf "$SDK_ROOT/cmdline-tools"

          rm -f /tmp/android-commandline-tools.zip
          rm -rf /tmp/android-commandline-tools

          echo
          echo "Downloading Android command-line tools..."
          echo

          wget \
            --progress=dot:giga \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_VERSION}_latest.zip" \
            -O /tmp/android-commandline-tools.zip

          mkdir -p /tmp/android-commandline-tools

          unzip -q \
            /tmp/android-commandline-tools.zip \
            -d /tmp/android-commandline-tools

          mkdir -p "$SDK_ROOT/cmdline-tools/latest"

          mv \
            /tmp/android-commandline-tools/cmdline-tools/* \
            "$SDK_ROOT/cmdline-tools/latest/"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          echo
          echo "sdkmanager location:"
          which sdkmanager

          echo
          echo "sdkmanager version:"
          sdkmanager --version


      # ------------------------------------------------------------
      # 7. Accept Android licenses
      # ------------------------------------------------------------

      - name: Accept Android licenses
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses \
            >/dev/null || true


      # ------------------------------------------------------------
      # 8. Install platform-tools
      # ------------------------------------------------------------

      - name: Install platform-tools
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --channel=3 \
            "platform-tools"


      # ------------------------------------------------------------
      # 9. Install Android 17 / API 37
      # ------------------------------------------------------------

      - name: Install Android API 37
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo
          echo "Available API 37 packages:"
          echo

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --list \
            --channel=3 \
            | grep -E "platforms;android-37|build-tools;37" \
            || true

          echo
          echo "Installing Android API 37..."
          echo

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --channel=3 \
            "platforms;android-37"


      # ------------------------------------------------------------
      # 10. CRITICAL CHECK
      #
      # This specifically prevents the previous:
      #
      # Failed to find target with hash string 'android-37'
      #
      # ------------------------------------------------------------

      - name: Verify Android API 37
        shell: bash
        run: |
          set -euxo pipefail

          PLATFORM_DIR="$ANDROID_SDK_ROOT/platforms/android-37"
          ANDROID_JAR="$PLATFORM_DIR/android.jar"

          echo
          echo "Installed platforms:"
          echo

          ls -lah "$ANDROID_SDK_ROOT/platforms" || true

          echo
          echo "API 37 directory:"
          echo

          ls -lah "$PLATFORM_DIR" || true

          if [ ! -f "$ANDROID_JAR" ]; then

            echo
            echo "================================================"
            echo "ERROR: Android API 37 did not install correctly"
            echo "================================================"
            echo
            echo "Missing:"
            echo "$ANDROID_JAR"
            echo
            echo "API 37 SDK packages available:"
            echo

            export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

            sdkmanager \
              --sdk_root="$ANDROID_SDK_ROOT" \
              --list \
              --channel=3 \
              | grep -i "android-37" \
              || true

            exit 1
          fi

          echo
          echo "========================================"
          echo "ANDROID API 37 VERIFIED SUCCESSFULLY"
          echo "========================================"
          echo
          echo "$ANDROID_JAR exists."


      # ------------------------------------------------------------
      # 11. Install Build Tools
      #
      # Prefer newest 37.x if available.
      # Fall back to 36.0.0 if necessary.
      # ------------------------------------------------------------

      - name: Install Android Build Tools
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo
          echo "Looking for Build Tools 37.x..."
          echo

          BUILD_TOOLS_PACKAGE="$(
            sdkmanager \
              --sdk_root="$ANDROID_SDK_ROOT" \
              --list \
              --channel=3 \
              | grep -oE 'build-tools;37\.[0-9]+\.[0-9]+' \
              | sort -V \
              | tail -n 1
          )"

          if [ -n "$BUILD_TOOLS_PACKAGE" ]; then

            echo "Installing:"
            echo "$BUILD_TOOLS_PACKAGE"

            sdkmanager \
              --sdk_root="$ANDROID_SDK_ROOT" \
              --channel=3 \
              "$BUILD_TOOLS_PACKAGE"

          else

            echo
            echo "No Build Tools 37.x found."
            echo "Falling back to Build Tools 36.0.0."
            echo

            sdkmanager \
              --sdk_root="$ANDROID_SDK_ROOT" \
              "build-tools;36.0.0"

          fi

          echo
          echo "Installed Build Tools:"
          ls -lah "$ANDROID_SDK_ROOT/build-tools"


      # ------------------------------------------------------------
      # 12. Install CMake version requested by current Shizuku
      #
      # Current manager/build.gradle requests:
      # 3.31.0+
      # ------------------------------------------------------------

      - name: Install Android CMake
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          CMAKE_PACKAGE="$(
            sdkmanager \
              --sdk_root="$ANDROID_SDK_ROOT" \
              --list \
              --channel=3 \
              | grep -oE 'cmake;3\.31\.[0-9]+' \
              | sort -V \
              | tail -n 1
          )"

          echo
          echo "Detected CMake package:"
          echo "$CMAKE_PACKAGE"

          if [ -n "$CMAKE_PACKAGE" ]; then

            sdkmanager \
              --sdk_root="$ANDROID_SDK_ROOT" \
              --channel=3 \
              "$CMAKE_PACKAGE"

          else

            echo
            echo "No SDK CMake 3.31.x package detected."
            echo "Allowing Gradle to resolve its required CMake version."
            echo

          fi


      # ------------------------------------------------------------
      # 13. Setup Gradle caching AFTER source exists
      #
      # This avoids the previous:
      #
      # No file ... matched **/*.gradle*
      #
      # ------------------------------------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # ------------------------------------------------------------
      # 14. Inspect Shizuku's current build configuration
      # ------------------------------------------------------------

      - name: Inspect Shizuku build configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd "$SHIZUKU_DIR"

          echo
          echo "========================================"
          echo "GRADLE WRAPPER"
          echo "========================================"
          echo

          cat gradle/wrapper/gradle-wrapper.properties

          echo
          echo "========================================"
          echo "ANDROID GRADLE PLUGIN REFERENCES"
          echo "========================================"
          echo

          grep -RniE \
            'com\.android\.tools\.build:gradle|com\.android\.application|com\.android\.library|agp' \
            . \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            --include='*.properties' \
            --exclude-dir='.git' \
            --exclude-dir='build' \
            || true

          echo
          echo "========================================"
          echo "SDK CONFIG"
          echo "========================================"
          echo

          grep -RniE \
            'compileSdk|compileSdkVersion|targetSdk|targetSdkVersion|buildToolsVersion' \
            . \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            --include='*.properties' \
            --exclude-dir='.git' \
            --exclude-dir='build' \
            || true


      # ------------------------------------------------------------
      # 15. Ensure compileSdk is API 37
      #
      # Handles several common Gradle declaration styles.
      # ------------------------------------------------------------

      - name: Configure compileSdk 37
        shell: bash
        run: |
          set -euxo pipefail

          cd "$SHIZUKU_DIR"

          echo
          echo "Patching compileSdk references to API 37..."
          echo

          find . \
            -type f \
            \( \
              -name "*.gradle" \
              -o \
              -name "*.gradle.kts" \
              -o \
              -name "*.toml" \
              -o \
              -name "*.properties" \
            \) \
            -not -path "./.git/*" \
            -not -path "*/build/*" \
            -print0 \
            | xargs -0 -r sed -i \
              -e 's/compileSdk = 36/compileSdk = 37/g' \
              -e 's/compileSdk=36/compileSdk=37/g' \
              -e 's/compileSdk 36/compileSdk 37/g' \
              -e 's/compileSdkVersion 36/compileSdkVersion 37/g' \
              -e 's/compileSdkVersion(36)/compileSdkVersion(37)/g' \
              -e 's/compile_sdk = 36/compile_sdk = 37/g' \
              -e 's/compile_sdk=36/compile_sdk=37/g'

          echo
          echo "compileSdk references now:"
          echo

          grep -RniE \
            'compileSdk|compileSdkVersion|compile_sdk' \
            . \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            --include='*.properties' \
            --exclude-dir='.git' \
            --exclude-dir='build' \
            || true


      # ------------------------------------------------------------
      # 16. Add API 37 Gradle property
      # ------------------------------------------------------------

      - name: Configure Gradle properties
        shell: bash
        run: |
          set -euxo pipefail

          cd "$SHIZUKU_DIR"

          touch gradle.properties

          sed -i \
            '/^android\.suppressUnsupportedCompileSdk=/d' \
            gradle.properties

          echo "" >> gradle.properties
          echo "# Android 17 / API 37" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=37" >> gradle.properties

          echo
          echo "gradle.properties:"
          echo

          cat gradle.properties


      # ------------------------------------------------------------
      # 17. Make wrapper executable
      # ------------------------------------------------------------

      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          set -euxo pipefail

          cd "$SHIZUKU_DIR"

          chmod +x gradlew


      # ------------------------------------------------------------
      # 18. Verify complete environment before compilation
      # ------------------------------------------------------------

      - name: Verify build environment
        shell: bash
        run: |
          set -euxo pipefail

          cd "$SHIZUKU_DIR"

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo
          echo "================================================"
          echo "JAVA"
          echo "================================================"
          echo

          java -version

          echo
          echo "JAVA_HOME=$JAVA_HOME"

          echo
          echo "================================================"
          echo "GRADLE"
          echo "================================================"
          echo

          ./gradlew --version

          echo
          echo "================================================"
          echo "ANDROID SDK"
          echo "================================================"
          echo

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "sdkmanager:"
          sdkmanager --version

          echo
          echo "================================================"
          echo "ANDROID API 37"
          echo "================================================"
          echo

          test -f \
            "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"

          ls -lh \
            "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"

          echo
          echo "================================================"
          echo "BUILD TOOLS"
          echo "================================================"
          echo

          ls -lah "$ANDROID_SDK_ROOT/build-tools"

          echo
          echo "================================================"
          echo "SUBMODULE STATUS"
          echo "================================================"
          echo

          git submodule status --recursive


      # ------------------------------------------------------------
      # 19. Clean previous outputs
      # ------------------------------------------------------------

      - name: Clean Shizuku
        shell: bash
        run: |
          set -euxo pipefail

          cd "$SHIZUKU_DIR"

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace


      # ------------------------------------------------------------
      # 20. BUILD
      #
      # Shizuku's documented APK build task is:
      #
      # :manager:assembleDebug
      #
      # ------------------------------------------------------------

      - name: Build Shizuku Android 17 Debug APK
        shell: bash
        run: |
          set -euxo pipefail

          cd "$SHIZUKU_DIR"

          ./gradlew \
            :manager:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ------------------------------------------------------------
      # 21. Display generated APKs
      # ------------------------------------------------------------

      - name: Find generated APKs
        if: always()
        shell: bash
        run: |
          echo
          echo "Generated APK files:"
          echo

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print \
            || true


      # ------------------------------------------------------------
      # 22. Collect Shizuku manager APK
      # ------------------------------------------------------------

      - name: Collect APK
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          ARTIFACT_DIR="$GITHUB_WORKSPACE/artifacts"

          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"

          echo
          echo "Looking for Shizuku manager APK..."
          echo

          find "$SHIZUKU_DIR/manager" \
            -type f \
            -name "*.apk" \
            -exec cp -v {} "$ARTIFACT_DIR/" \;

          echo
          echo "Collected files:"
          echo

          ls -lah "$ARTIFACT_DIR"

          APK_COUNT="$(
            find "$ARTIFACT_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l
          )"

          echo
          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo
            echo "ERROR: Build succeeded but no manager APK was found."
            exit 1
          fi


      # ------------------------------------------------------------
      # 23. Upload APK to GitHub Actions artifacts
      # ------------------------------------------------------------

      - name: Upload Shizuku Android 17 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Shizuku-Android-17-Debug
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
