name: Build Shizuku Android 17 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # FIND UPLOADED SOURCE ZIP
      # ============================================================

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -iname '*.zip' \
              | head -n 1
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."

            echo
            echo "Repository contents:"
            ls -lah "$GITHUB_WORKSPACE"

            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # ============================================================
      # EXTRACT SOURCE
      # ============================================================

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q \
            "${{ steps.zip.outputs.zip_file }}" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "ZIP extracted."

          echo
          echo "Top of extracted tree:"

          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 3 \
            -print \
            | head -200


      # ============================================================
      # LOCATE GRADLE PROJECT
      # ============================================================

      - name: Locate Shizuku project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name gradlew \
              | head -n 1
          )"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the ZIP."

            echo
            echo "Extracted files:"

            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 5 \
              -print \
              | head -300

            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ============================================================
      # DISPLAY PROJECT
      # ============================================================

      - name: Show project contents
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          echo "Project root:"
          pwd

          echo
          ls -la


      # ============================================================
      # POPULATE SHIZUKU API MODULE IF ZIP DOES NOT CONTAIN IT
      # ============================================================

      - name: Populate Shizuku API module
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          if [ -d api ]; then

            if [ -n "$(find api -mindepth 1 -maxdepth 1 2>/dev/null)" ]; then
              echo "api module already populated."
            else
              echo "api directory exists but is empty."
              rm -rf api
            fi

          fi

          if [ ! -d api ]; then

            echo "Downloading Shizuku API..."

            git clone \
              --depth 1 \
              https://github.com/RikkaApps/Shizuku-API.git \
              api

          fi

          echo
          echo "API contents:"
          ls -la api


      # ============================================================
      # JAVA 21
      #
      # v5 fixes the Node 20 deprecation warning.
      # ============================================================

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=$JAVA_HOME"

          java -version


      # ============================================================
      # INSTALL CURRENT ANDROID COMMAND LINE TOOLS
      # ============================================================

      - name: Install latest Android command line tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd "$RUNNER_TEMP"

          rm -rf cmdline-tools
          rm -f commandlinetools.zip

          echo "Downloading current Android command line tools..."

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          rm -rf "$SDK/cmdline-tools/latest"

          mkdir -p "$SDK/cmdline-tools/latest"

          mv \
            cmdline-tools/* \
            "$SDK/cmdline-tools/latest/"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"


      # ============================================================
      # VERIFY SDKMANAGER
      # ============================================================

      - name: Verify sdkmanager
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          echo "sdkmanager:"
          which sdkmanager

          echo
          echo "sdkmanager version:"

          sdkmanager --version


      # ============================================================
      # LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses \
            >/dev/null 2>&1 || true


      # ============================================================
      # CACHE SDK PACKAGE LIST
      # ============================================================

      - name: Show Android 17 SDK packages
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          echo "========================================"
          echo "ANDROID 17 / API 37 SDK PACKAGES"
          echo "========================================"

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --list \
            --channel=3 \
            > "$RUNNER_TEMP/sdk-packages.txt"

          grep -i -E \
            'platforms;android-37|build-tools;37|cinnamon' \
            "$RUNNER_TEMP/sdk-packages.txt" \
            || true

          echo
          echo "========================================"
          echo "AVAILABLE PLATFORM PACKAGES"
          echo "========================================"

          grep -E \
            '^[[:space:]]*platforms;' \
            "$RUNNER_TEMP/sdk-packages.txt" \
            | tail -40 \
            || true


      # ============================================================
      # DETECT API 37.0
      #
      # IMPORTANT:
      #
      # Your GitHub runner showed:
      #
      # platforms;android-37.0
      # platforms;android-37.1
      # platforms;android-37.2-beta...
      #
      # We want the base Android 17 / API 37 platform:
      #
      # platforms;android-37.0
      # ============================================================

      - name: Detect Android 17 platform
        id: android17
        shell: bash
        run: |
          set -euo pipefail

          SDK_LIST="$RUNNER_TEMP/sdk-packages.txt"

          PLATFORM_PACKAGE="$(
            grep -E \
              '^[[:space:]]*platforms;android-37\.0[[:space:]]*\|' \
              "$SDK_LIST" \
              | sed -E 's/^[[:space:]]*//' \
              | cut -d'|' -f1 \
              | sed -E 's/[[:space:]]+$//' \
              | head -n 1
          )"

          echo "Detected Android 17 platform:"
          echo "$PLATFORM_PACKAGE"

          if [ -z "$PLATFORM_PACKAGE" ]; then

            echo
            echo "ERROR: platforms;android-37.0 was not found."

            echo
            echo "Android 37 entries available:"

            grep -i -E \
              'platforms;android-37|cinnamon|api.?37' \
              "$SDK_LIST" \
              || true

            exit 1
          fi

          echo "platform_package=$PLATFORM_PACKAGE" \
            >> "$GITHUB_OUTPUT"


      # ============================================================
      # DETECT BUILD TOOLS
      # ============================================================

      - name: Detect Android 37 Build Tools
        id: buildtools
        shell: bash
        run: |
          set -euo pipefail

          SDK_LIST="$RUNNER_TEMP/sdk-packages.txt"

          BUILD_TOOLS_PACKAGE="$(
            grep -E \
              '^[[:space:]]*build-tools;37\.' \
              "$SDK_LIST" \
              | sed -E 's/^[[:space:]]*//' \
              | cut -d'|' -f1 \
              | sed -E 's/[[:space:]]+$//' \
              | sort -V \
              | tail -n 1
          )"

          echo "Detected Android 37 Build Tools:"
          echo "$BUILD_TOOLS_PACKAGE"

          if [ -z "$BUILD_TOOLS_PACKAGE" ]; then

            echo
            echo "No Android Build Tools 37.x found."
            echo "Falling back to Build Tools 36.0.0."

            BUILD_TOOLS_PACKAGE="build-tools;36.0.0"

          fi

          echo "build_tools_package=$BUILD_TOOLS_PACKAGE" \
            >> "$GITHUB_OUTPUT"


      # ============================================================
      # INSTALL API 37.0
      # ============================================================

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          echo "Installing platform-tools..."

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools"

          echo
          echo "Installing Android 17 platform:"
          echo "${{ steps.android17.outputs.platform_package }}"

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --channel=3 \
            "${{ steps.android17.outputs.platform_package }}"

          echo
          echo "Installing Build Tools:"
          echo "${{ steps.buildtools.outputs.build_tools_package }}"

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --channel=3 \
            "${{ steps.buildtools.outputs.build_tools_package }}"


      # ============================================================
      # VERIFY API 37.0
      # ============================================================

      - name: Verify Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Installed SDK platform android.jar files:"
          echo

          find "$ANDROID_SDK_ROOT/platforms" \
            -maxdepth 2 \
            -type f \
            -name android.jar \
            -print \
            || true

          echo
          echo "Installed platform directories:"

          ls -lah "$ANDROID_SDK_ROOT/platforms"

          ANDROID_37_DIR="$ANDROID_SDK_ROOT/platforms/android-37.0"

          echo
          echo "Checking:"
          echo "$ANDROID_37_DIR"

          if [ ! -f "$ANDROID_37_DIR/android.jar" ]; then

            echo
            echo "========================================"
            echo "ERROR: ANDROID API 37.0 NOT INSTALLED"
            echo "========================================"

            echo
            echo "Expected:"
            echo "$ANDROID_37_DIR/android.jar"

            echo
            echo "Actual platform directories:"

            find "$ANDROID_SDK_ROOT/platforms" \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -print \
              || true

            exit 1

          fi

          echo
          echo "========================================"
          echo "ANDROID API 37.0 VERIFIED"
          echo "========================================"

          ls -lh "$ANDROID_37_DIR/android.jar"

          echo
          echo "Installed Build Tools:"

          ls -lah "$ANDROID_SDK_ROOT/build-tools"


      # ============================================================
      # INSPECT CURRENT GRADLE / AGP CONFIGURATION
      # ============================================================

      - name: Inspect current Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          echo "========================================"
          echo "GRADLE WRAPPER"
          echo "========================================"

          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            cat gradle/wrapper/gradle-wrapper.properties
          fi

          echo
          echo "========================================"
          echo "ANDROID GRADLE PLUGIN REFERENCES"
          echo "========================================"

          grep -RniE \
            '8\.10\.1|com\.android\.tools\.build:gradle|agp[[:space:]]*=' \
            . \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            --include='*.properties' \
            --exclude-dir=.git \
            --exclude-dir=build \
            || true

          echo
          echo "========================================"
          echo "SDK REFERENCES"
          echo "========================================"

          grep -RniE \
            'compileSdk|compileSdkVersion|targetSdk|targetSdkVersion' \
            . \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            --include='*.properties' \
            --exclude-dir=.git \
            --exclude-dir=build \
            || true


      # ============================================================
      # UPDATE AGP FOR API 37
      #
      # Previous run identified:
      #
      # AGP 8.10.1
      #
      # Replace only that exact version with 9.1.1.
      # ============================================================

      - name: Upgrade Android Gradle Plugin
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          echo "Replacing AGP 8.10.1 with 9.1.1..."

          find . \
            -type f \
            \( \
              -name '*.gradle' \
              -o -name '*.gradle.kts' \
              -o -name '*.toml' \
              -o -name '*.properties' \
            \) \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -print0 \
            | xargs -0 -r sed -i \
                's/8\.10\.1/9.1.1/g'

          echo
          echo "AGP references after update:"

          grep -RniE \
            '8\.10\.1|9\.1\.1|com\.android\.tools\.build:gradle' \
            . \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            --include='*.properties' \
            --exclude-dir=.git \
            --exclude-dir=build \
            || true


      # ============================================================
      # UPDATE GRADLE WRAPPER
      # ============================================================

      - name: Upgrade Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          WRAPPER="gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER" ]; then
            echo "ERROR: Gradle wrapper properties not found."
            exit 1
          fi

          echo "Old Gradle wrapper:"
          cat "$WRAPPER"

          sed -i \
            's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' \
            "$WRAPPER"

          echo
          echo "New Gradle wrapper:"
          cat "$WRAPPER"


      # ============================================================
      # KEEP PROJECT ON compileSdk 37
      # ============================================================

      - name: Configure compileSdk 37
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          find . \
            -type f \
            \( \
              -name '*.gradle' \
              -o -name '*.gradle.kts' \
              -o -name '*.toml' \
              -o -name '*.properties' \
            \) \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -print0 \
            | xargs -0 -r sed -i \
              -e 's/compileSdk = 36/compileSdk = 37/g' \
              -e 's/compileSdk=36/compileSdk=37/g' \
              -e 's/compileSdk 36/compileSdk 37/g' \
              -e 's/compileSdkVersion 36/compileSdkVersion 37/g' \
              -e 's/compileSdkVersion(36)/compileSdkVersion(37)/g' \
              -e 's/compile_sdk = 36/compile_sdk = 37/g' \
              -e 's/compile_sdk=36/compile_sdk=37/g'

          echo
          echo "compileSdk references:"

          grep -RniE \
            'compileSdk|compileSdkVersion|compile_sdk' \
            . \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            --include='*.properties' \
            --exclude-dir=.git \
            --exclude-dir=build \
            || true


      # ============================================================
      # PREPARE GRADLE
      # ============================================================

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          chmod +x gradlew

          echo "Gradle environment:"
          ./gradlew --version


      # ============================================================
      # SHOW PROJECT MODULES
      # ============================================================

      - name: Show Gradle projects
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew projects \
            --no-daemon \
            --stacktrace \
            || true


      # ============================================================
      # SHOW DEBUG TASKS
      # ============================================================

      - name: Show debug build tasks
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew tasks \
            --all \
            --no-daemon \
            | grep -E \
                'manager:assembleDebug|assembleDebug' \
            || true


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # BUILD SHIZUKU
      # ============================================================

      - name: Build Shizuku debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          echo "Checking for :manager:assembleDebug..."

          if ./gradlew tasks --all --no-daemon \
              | grep -q ':manager:assembleDebug'; then

            echo
            echo "========================================"
            echo "BUILDING SHIZUKU MANAGER"
            echo "========================================"

            ./gradlew \
              :manager:assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all

          else

            echo
            echo ":manager:assembleDebug was not detected."
            echo "Falling back to full assembleDebug."

            ./gradlew \
              assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all

          fi


      # ============================================================
      # FIND APK FILES
      # ============================================================

      - name: Find generated APKs
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project_dir }}"

          rm -rf "$GITHUB_WORKSPACE/apk-output"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          COUNT=0

          while IFS= read -r APK; do

            echo "Found APK:"
            echo "$APK"

            BASENAME="$(basename "$APK")"

            RELATIVE="$(
              echo "$APK" \
                | sed "s#^$PROJECT/##"
            )"

            MODULE="$(
              echo "$RELATIVE" \
                | cut -d/ -f1
            )"

            DEST="$GITHUB_WORKSPACE/apk-output/$BASENAME"

            if [ -e "$DEST" ]; then
              DEST="$GITHUB_WORKSPACE/apk-output/${MODULE}-${BASENAME}"
            fi

            cp "$APK" "$DEST"

            COUNT=$((COUNT + 1))

          done < <(
            find "$PROJECT" \
              -type f \
              -path '*/build/outputs/apk/*' \
              -name '*.apk'
          )

          if [ "$COUNT" -eq 0 ]; then

            echo
            echo "ERROR: Build completed but no APK was found."

            echo
            echo "All APK-like files under project:"

            find "$PROJECT" \
              -type f \
              -iname '*.apk' \
              -print \
              || true

            exit 1

          fi

          echo
          echo "Collected $COUNT APK(s)."


      # ============================================================
      # APK INFORMATION
      # ============================================================

      - name: Display APK information
        shell: bash
        run: |
          set -euo pipefail

          echo "APK output:"
          ls -lh "$GITHUB_WORKSPACE/apk-output"

          echo

          for APK in "$GITHUB_WORKSPACE"/apk-output/*.apk; do

            echo "--------------------------------"
            echo "$APK"

            sha256sum "$APK"

          done


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shizuku-Android17-API37-Debug-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
