name: Build Shizuku Android 17

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euxo pipefail

          SDK_ROOT="$ANDROID_SDK_ROOT"
          CMDLINE_VERSION="15859902"

          echo "Creating Android SDK directory..."
          mkdir -p "$SDK_ROOT"

          echo "Removing old command-line tools..."
          rm -rf "$SDK_ROOT/cmdline-tools"

          echo "Downloading current Android command-line tools..."

          wget \
            --progress=dot:giga \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_VERSION}_latest.zip" \
            -O /tmp/android-commandline-tools.zip

          rm -rf /tmp/android-commandline-tools
          mkdir -p /tmp/android-commandline-tools

          unzip -q \
            /tmp/android-commandline-tools.zip \
            -d /tmp/android-commandline-tools

          mkdir -p "$SDK_ROOT/cmdline-tools/latest"

          mv \
            /tmp/android-commandline-tools/cmdline-tools/* \
            "$SDK_ROOT/cmdline-tools/latest/"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          echo
          echo "sdkmanager location:"
          which sdkmanager

          echo
          echo "sdkmanager version:"
          sdkmanager --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses \
            >/dev/null || true

      - name: Install Android 17 API 37
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "Installing platform-tools..."

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --channel=3 \
            "platform-tools"

          echo
          echo "Installing Android API 37..."

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --channel=3 \
            "platforms;android-37"

          echo
          echo "Installed Android platforms:"

          ls -lah "$ANDROID_SDK_ROOT/platforms" || true

          echo
          echo "Checking Android 37 directory..."

          ls -lah "$ANDROID_SDK_ROOT/platforms/android-37" || true

          echo
          echo "Checking android.jar..."

          if [ ! -f "$ANDROID_SDK_ROOT/platforms/android-37/android.jar" ]; then
            echo "ERROR: Android API 37 installation failed."
            echo
            echo "Available SDK packages containing android-37:"
            sdkmanager \
              --sdk_root="$ANDROID_SDK_ROOT" \
              --list \
              --channel=3 \
              | grep -i "android-37" || true

            exit 1
          fi

          echo
          echo "SUCCESS: Android API 37 android.jar exists."

      - name: Install Android Build Tools 37
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "Searching for newest Android Build Tools 37..."

          BUILD_TOOLS_PACKAGE="$(
            sdkmanager \
              --sdk_root="$ANDROID_SDK_ROOT" \
              --list \
              --channel=3 \
              | grep -oE 'build-tools;37\.[0-9]+\.[0-9]+' \
              | sort -V \
              | tail -n 1
          )"

          echo
          echo "Newest Build Tools package:"
          echo "$BUILD_TOOLS_PACKAGE"

          if [ -z "$BUILD_TOOLS_PACKAGE" ]; then
            echo "ERROR: No Android 37 Build Tools package was found."
            exit 1
          fi

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --channel=3 \
            "$BUILD_TOOLS_PACKAGE"

          echo
          echo "Installed Build Tools:"
          ls -lah "$ANDROID_SDK_ROOT/build-tools"

      - name: Locate Shizuku source
        shell: bash
        run: |
          set -euxo pipefail

          echo "Repository contents:"
          find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name gradlew -print

          SHIZUKU_DIR="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name gradlew \
              -printf '%h\n' \
              | head -n 1
          )"

          if [ -z "$SHIZUKU_DIR" ]; then
            echo "ERROR: Could not find Shizuku Gradle project."
            exit 1
          fi

          echo "SHIZUKU_DIR=$SHIZUKU_DIR" >> "$GITHUB_ENV"

          echo
          echo "Shizuku project:"
          echo "$SHIZUKU_DIR"

      - name: Inspect current Gradle configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd "$SHIZUKU_DIR"

          echo "Gradle wrapper:"
          grep \
            "distributionUrl" \
            gradle/wrapper/gradle-wrapper.properties \
            || true

          echo
          echo "Android Gradle Plugin references:"

          grep -RniE \
            'com\.android\.tools\.build:gradle|com\.android\.application|com\.android\.library|8\.10\.1' \
            . \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            --exclude-dir='.git' \
            --exclude-dir='build' \
            || true

          echo
          echo "compileSdk references:"

          grep -RniE \
            'compileSdk|compileSdkVersion' \
            . \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            --exclude-dir='.git' \
            --exclude-dir='build' \
            || true

      - name: Upgrade Gradle wrapper for API 37
        shell: bash
        run: |
          set -euxo pipefail

          cd "$SHIZUKU_DIR"

          WRAPPER="gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER" ]; then
            echo "ERROR: Gradle wrapper properties not found."
            exit 1
          fi

          sed -i \
            's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' \
            "$WRAPPER"

          echo "Updated Gradle wrapper:"
          cat "$WRAPPER"

      - name: Upgrade Android Gradle Plugin
        shell: bash
        run: |
          set -euxo pipefail

          cd "$SHIZUKU_DIR"

          echo "Replacing AGP 8.10.1 with AGP 9.1.1..."

          find . \
            -type f \
            \( \
              -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "*.toml" \
            \) \
            -not -path "./.git/*" \
            -not -path "*/build/*" \
            -print0 \
            | xargs -0 -r sed -i \
                's/8\.10\.1/9.1.1/g'

          echo
          echo "AGP references after modification:"

          grep -RniE \
            '9\.1\.1|com\.android\.tools\.build:gradle|com\.android\.application|com\.android\.library' \
            . \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            --exclude-dir='.git' \
            --exclude-dir='build' \
            || true

      - name: Configure API 37
        shell: bash
        run: |
          set -euxo pipefail

          cd "$SHIZUKU_DIR"

          echo "Changing compileSdk 36 to 37 where applicable..."

          find . \
            -type f \
            \( \
              -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "*.toml" \
            \) \
            -not -path "./.git/*" \
            -not -path "*/build/*" \
            -print0 \
            | xargs -0 -r sed -i \
                -e 's/compileSdk = 36/compileSdk = 37/g' \
                -e 's/compileSdk=36/compileSdk=37/g' \
                -e 's/compileSdkVersion 36/compileSdkVersion 37/g' \
                -e 's/compileSdkVersion(36)/compileSdkVersion(37)/g'

          echo
          echo "compileSdk after modification:"

          grep -RniE \
            'compileSdk|compileSdkVersion' \
            . \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            --exclude-dir='.git' \
            --exclude-dir='build' \
            || true

      - name: Add Android 17 Gradle properties
        shell: bash
        run: |
          set -euxo pipefail

          cd "$SHIZUKU_DIR"

          touch gradle.properties

          sed -i \
            '/^android\.suppressUnsupportedCompileSdk=/d' \
            gradle.properties

          sed -i \
            '/^org\.gradle\.java\.home=/d' \
            gradle.properties

          cat >> gradle.properties <<'EOF'

          # Android 17 / API 37 build
          android.suppressUnsupportedCompileSdk=37
          EOF

          echo
          echo "gradle.properties:"
          cat gradle.properties

      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          set -euxo pipefail

          cd "$SHIZUKU_DIR"

          chmod +x gradlew

      - name: Verify build environment
        shell: bash
        run: |
          set -euxo pipefail

          cd "$SHIZUKU_DIR"

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "====================================="
          echo "JAVA"
          echo "====================================="
          java -version

          echo
          echo "====================================="
          echo "GRADLE"
          echo "====================================="
          ./gradlew --version

          echo
          echo "====================================="
          echo "SDKMANAGER"
          echo "====================================="
          sdkmanager --version

          echo
          echo "====================================="
          echo "ANDROID API 37"
          echo "====================================="
          ls -lah "$ANDROID_SDK_ROOT/platforms/android-37"

          test -f \
            "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"

          echo
          echo "====================================="
          echo "BUILD TOOLS"
          echo "====================================="
          ls -lah "$ANDROID_SDK_ROOT/build-tools"

      - name: Build Shizuku Debug APK
        shell: bash
        run: |
          set -euxo pipefail

          cd "$SHIZUKU_DIR"

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Find generated APKs
        if: always()
        shell: bash
        run: |
          echo "Generated APK files:"

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print \
            || true

      - name: Collect APKs
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          find "$SHIZUKU_DIR" \
            -type f \
            -name "*.apk" \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;

          echo
          echo "Artifact directory:"

          ls -lah "$GITHUB_WORKSPACE/artifacts"

          if ! find "$GITHUB_WORKSPACE/artifacts" \
            -type f \
            -name "*.apk" \
            | grep -q .; then

            echo "ERROR: Build completed but no APK was found."
            exit 1
          fi

      - name: Upload Shizuku APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Shizuku-Android-17-Debug
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
