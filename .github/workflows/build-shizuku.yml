name: Build Shizuku Android 17 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "${{ steps.zip.outputs.zip_file }}" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "Extracted source."

      - name: Locate Shizuku project
        id: project
        shell: bash
        run: |
          set -e

          GRADLEW="$(find "$GITHUB_WORKSPACE/extracted" -type f -name gradlew | head -n 1)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Could not find gradlew inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Project root:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show project information
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          echo "Project root:"
          pwd

          echo
          echo "Top-level contents:"
          ls -la

      - name: Populate Shizuku API module
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          if [ -d api ]; then
            if [ -n "$(find api -mindepth 1 -maxdepth 1 2>/dev/null)" ]; then
              echo "Existing api module is populated."
            else
              echo "Existing api directory is empty."
              rm -rf api
            fi
          fi

          if [ ! -d api ]; then
            echo "Downloading Shizuku API..."
            git clone \
              --depth 1 \
              https://github.com/RikkaApps/Shizuku-API.git \
              api
          fi

          echo
          echo "API directory:"
          ls -la api

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Update Android SDK command-line tools
        shell: bash
        run: |
          set -e

          echo "SDK root:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "Current sdkmanager:"
          which sdkmanager
          sdkmanager --version || true

          echo
          echo "Accepting licenses..."
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo
          echo "Updating SDK packages..."
          sdkmanager --update || true

      - name: Show available Android 17 packages
        shell: bash
        run: |
          echo "Searching SDK repository for Android 17/API 37 packages..."

          sdkmanager --list --channel=3 | \
            grep -i -E "android-37|37\.0|cinnamon" || true

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -e

          echo "Installing Android 17/API 37..."

          sdkmanager --channel=3 \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0"

      - name: Verify Android SDK installation
        shell: bash
        run: |
          set -e

          echo "Installed Android platforms:"
          ls -la "$ANDROID_SDK_ROOT/platforms" || true

          echo
          echo "Installed build tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools" || true

          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            echo "ERROR: Android API 37 platform was not installed."
            exit 1
          fi

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          chmod +x gradlew

          ./gradlew --version

      - name: Show Gradle project
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew projects \
            --no-daemon \
            --stacktrace || true

      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      - name: Build Shizuku debug APK
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find generated APKs
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project_dir }}"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          echo "Searching for APK files..."

          COUNT=0

          while IFS= read -r APK; do
            echo "Found:"
            echo "$APK"

            cp "$APK" "$GITHUB_WORKSPACE/apk-output/"

            COUNT=$((COUNT + 1))
          done < <(
            find "$PROJECT" \
              -type f \
              -name '*.apk'
          )

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: Build completed but no APK was found."
            exit 1
          fi

          echo
          echo "Collected $COUNT APK(s)."

      - name: Display APK information
        shell: bash
        run: |
          echo "APK output:"
          ls -lh "$GITHUB_WORKSPACE/apk-output"

          echo

          for APK in "$GITHUB_WORKSPACE"/apk-output/*.apk; do
            echo "--------------------------------"
            echo "$APK"
            sha256sum "$APK"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shizuku-Android17-Debug-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
