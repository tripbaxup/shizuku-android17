name: Build Shizuku Android 17 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. FIND SOURCE ZIP
      # ============================================================

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -iname '*.zip' \
              | head -n 1
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP found in repository root."
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 3. EXTRACT SOURCE
      # ============================================================

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q \
            "${{ steps.zip.outputs.zip_file }}" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "Source extracted."


      # ============================================================
      # 4. FIND SHIZUKU PROJECT
      # ============================================================

      - name: Locate Shizuku project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name gradlew \
              | head -n 1
          )"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Shizuku project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 5. POPULATE SHIZUKU API
      # ============================================================

      - name: Populate Shizuku API
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          # ZIP downloads do not preserve Git submodule contents.
          # If the API module isn't populated, download it.

          if [ ! -d "api/api" ]; then

            echo "Shizuku API module missing."

            rm -rf api

            echo "Downloading Shizuku API..."

            git clone \
              --depth 1 \
              https://github.com/RikkaApps/Shizuku-API.git \
              api

          else

            echo "Shizuku API already populated."

          fi

          echo
          echo "API modules:"

          find api \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -printf '%f\n' \
            | sort


      # ============================================================
      # 6. FIX HIDDEN API STUB
      #
      # Root Shizuku expects:
      #
      # api/hidden-api-stub
      #
      # Current Shizuku API contains:
      #
      # api/demo-hidden-api-stub
      #
      # Copy it to the location the root project expects.
      # ============================================================

      - name: Fix hidden API stub
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          if [ ! -d "api/hidden-api-stub" ]; then

            if [ ! -d "api/demo-hidden-api-stub" ]; then
              echo "ERROR: demo-hidden-api-stub is also missing."
              exit 1
            fi

            echo "Creating hidden-api-stub..."

            cp -a \
              api/demo-hidden-api-stub \
              api/hidden-api-stub

          fi

          echo
          echo "hidden-api-stub ready:"
          ls -la api/hidden-api-stub


      # ============================================================
      # 7. JAVA 21
      # ============================================================

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail
          java -version


      # ============================================================
      # 8. INSTALL ANDROID COMMAND LINE TOOLS
      # ============================================================

      - name: Install Android command line tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd "$RUNNER_TEMP"

          rm -rf cmdline-tools
          rm -f commandlinetools.zip

          echo "Downloading Android command line tools..."

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          rm -rf "$SDK/cmdline-tools/latest"

          mkdir -p "$SDK/cmdline-tools/latest"

          mv \
            cmdline-tools/* \
            "$SDK/cmdline-tools/latest/"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"


      # ============================================================
      # 9. ACCEPT LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses \
            >/dev/null 2>&1 || true


      # ============================================================
      # 10. FIND BUILD TOOLS 37
      # ============================================================

      - name: Detect Android 37 Build Tools
        id: buildtools
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          BUILD_TOOLS_PACKAGE="$(
            sdkmanager \
              --sdk_root="$ANDROID_SDK_ROOT" \
              --list \
              --channel=3 \
              | grep -E '^[[:space:]]*build-tools;37\.' \
              | sed -E 's/^[[:space:]]*//' \
              | cut -d'|' -f1 \
              | sed -E 's/[[:space:]]+$//' \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_PACKAGE" ]; then
            echo "No Build Tools 37 found."
            echo "Using 36.0.0."
            BUILD_TOOLS_PACKAGE="build-tools;36.0.0"
          fi

          echo "Using:"
          echo "$BUILD_TOOLS_PACKAGE"

          echo "package=$BUILD_TOOLS_PACKAGE" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 11. INSTALL ANDROID 17 / API 37.0
      # ============================================================

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          echo "Installing platform-tools..."

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools"

          echo
          echo "Installing Android 17 / API 37.0..."

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --channel=3 \
            "platforms;android-37.0"

          echo
          echo "Installing Build Tools..."

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --channel=3 \
            "${{ steps.buildtools.outputs.package }}"


      # ============================================================
      # 12. VERIFY ANDROID 37
      # ============================================================

      - name: Verify Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"

          if [ ! -f "$ANDROID_JAR" ]; then

            echo "ERROR: Android API 37.0 was not installed."

            echo
            echo "Installed platforms:"

            find "$ANDROID_SDK_ROOT/platforms" \
              -maxdepth 2 \
              -name android.jar \
              -print \
              || true

            exit 1
          fi

          echo "Android API 37.0 installed:"
          ls -lh "$ANDROID_JAR"


      # ============================================================
      # 13. FIX SDK PATH EXPECTED BY COMPILESDK 37
      #
      # sdkmanager installs:
      #
      # platforms/android-37.0
      #
      # Existing Android Gradle tooling may request:
      #
      # platforms/android-37
      #
      # Give Gradle that path without modifying the SDK files.
      # ============================================================

      - name: Create Android 37 compatibility path
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_SDK_ROOT/platforms"

          if [ ! -e "android-37" ]; then

            echo "Creating Android 37 compatibility symlink..."

            ln -s \
              android-37.0 \
              android-37

          fi

          echo
          echo "Platform directories:"

          ls -lah "$ANDROID_SDK_ROOT/platforms"

          echo
          echo "Checking android-37/android.jar:"

          test -f \
            "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"

          ls -lh \
            "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"


      # ============================================================
      # 14. COMPILE SDK 37
      # ============================================================

      - name: Configure compileSdk 37
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          find . \
            -type f \
            \( \
              -name '*.gradle' \
              -o -name '*.gradle.kts' \
              -o -name '*.toml' \
              -o -name '*.properties' \
            \) \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -print0 \
            | xargs -0 -r sed -i \
              -e 's/compileSdk = 36/compileSdk = 37/g' \
              -e 's/compileSdk=36/compileSdk=37/g' \
              -e 's/compileSdk 36/compileSdk 37/g' \
              -e 's/compileSdkVersion 36/compileSdkVersion 37/g' \
              -e 's/compileSdkVersion(36)/compileSdkVersion(37)/g'

          echo "compileSdk configuration:"

          grep -RniE \
            'compileSdk|compileSdkVersion' \
            . \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            --exclude-dir=.git \
            --exclude-dir=build \
            || true


      # ============================================================
      # 15. SUPPRESS API 37 AGP WARNING
      # ============================================================

      - name: Configure Gradle properties
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          touch gradle.properties

          sed -i \
            '/^android\.suppressUnsupportedCompileSdk=/d' \
            gradle.properties

          echo \
            "android.suppressUnsupportedCompileSdk=37" \
            >> gradle.properties


      # ============================================================
      # 16. PREPARE ORIGINAL GRADLE WRAPPER
      #
      # Do NOT force Gradle 9 here.
      # Use the wrapper supplied by your Shizuku source.
      # ============================================================

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          chmod +x gradlew

          echo "Using project's Gradle wrapper:"

          ./gradlew --version


      # ============================================================
      # 17. CLEAN
      # ============================================================

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 18. BUILD
      # ============================================================

      - name: Build Shizuku debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          echo "Building Shizuku..."

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 19. COLLECT APK
      # ============================================================

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project_dir }}"

          OUTPUT="$GITHUB_WORKSPACE/apk-output"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"

          COUNT=0

          while IFS= read -r APK; do

            echo "Found APK:"
            echo "$APK"

            BASENAME="$(basename "$APK")"

            DEST="$OUTPUT/$BASENAME"

            if [ -e "$DEST" ]; then
              DEST="$OUTPUT/${COUNT}-${BASENAME}"
            fi

            cp "$APK" "$DEST"

            COUNT=$((COUNT + 1))

          done < <(
            find "$PROJECT" \
              -type f \
              -path '*/build/outputs/apk/*' \
              -name '*.apk'
          )

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No APK generated."
            exit 1
          fi

          echo
          echo "Collected $COUNT APK(s)."

          ls -lh "$OUTPUT"


      # ============================================================
      # 20. APK HASHES
      # ============================================================

      - name: Display APK information
        shell: bash
        run: |
          set -euo pipefail

          for APK in "$GITHUB_WORKSPACE"/apk-output/*.apk; do

            echo
            echo "--------------------------------"

            ls -lh "$APK"

            sha256sum "$APK"

          done


      # ============================================================
      # 21. UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shizuku-Android17-API37-Debug
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
