name: Build Shizuku Android 17 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "${{ steps.zip.outputs.zip_file }}" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "ZIP extracted."

      - name: Locate Shizuku project
        id: project
        shell: bash
        run: |
          set -e

          GRADLEW="$(find "$GITHUB_WORKSPACE/extracted" -type f -name gradlew | head -n 1)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show project contents
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          echo "Project root:"
          pwd

          echo
          ls -la

      - name: Populate Shizuku API module
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          if [ -d api ]; then
            if [ -n "$(find api -mindepth 1 -maxdepth 1 2>/dev/null)" ]; then
              echo "api module already populated."
            else
              echo "api directory is empty. Removing it."
              rm -rf api
            fi
          fi

          if [ ! -d api ]; then
            echo "Downloading Shizuku API..."

            git clone \
              --depth 1 \
              https://github.com/RikkaApps/Shizuku-API.git \
              api
          fi

          echo
          echo "API contents:"
          ls -la api

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install latest Android command line tools
        shell: bash
        run: |
          set -e

          SDK="$HOME/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd "$RUNNER_TEMP"

          echo "Downloading current Android command line tools..."

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          rm -rf "$SDK/cmdline-tools/latest"
          mkdir -p "$SDK/cmdline-tools/latest"

          mv cmdline-tools/* "$SDK/cmdline-tools/latest/"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Verify sdkmanager
        shell: bash
        run: |
          set -e

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          echo "sdkmanager:"
          which sdkmanager

          sdkmanager --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses >/dev/null 2>&1 || true

      - name: Show Android 17 SDK packages
        shell: bash
        run: |
          set -e

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          echo "========================================"
          echo "Searching all preview channels for API 37"
          echo "========================================"

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --list \
            --channel=3 \
            > "$RUNNER_TEMP/sdk-packages.txt"

          grep -i -E \
            "cinnamon|android-37|37\.0|api.?37" \
            "$RUNNER_TEMP/sdk-packages.txt" \
            || true

          echo
          echo "========================================"
          echo "Available platform packages"
          echo "========================================"

          grep -E \
            '^[[:space:]]*platforms;' \
            "$RUNNER_TEMP/sdk-packages.txt" \
            | tail -30 \
            || true

      - name: Detect Android 17 platform package
        id: android17
        shell: bash
        run: |
          set -e

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          SDK_LIST="$RUNNER_TEMP/sdk-packages.txt"

          PLATFORM_PACKAGE="$(
            grep -i -E \
              '^[[:space:]]*platforms;.*(37|cinnamon)' \
              "$SDK_LIST" \
              | sed -E 's/^[[:space:]]*//' \
              | cut -d'|' -f1 \
              | sed -E 's/[[:space:]]+$//' \
              | head -n 1
          )"

          if [ -z "$PLATFORM_PACKAGE" ]; then
            PLATFORM_PACKAGE="$(
              grep -i "cinnamon" "$SDK_LIST" \
              | grep -i "platform" \
              | sed -E 's/^[[:space:]]*//' \
              | cut -d'|' -f1 \
              | sed -E 's/[[:space:]]+$//' \
              | head -n 1
            )"
          fi

          echo "Detected platform package:"
          echo "$PLATFORM_PACKAGE"

          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo
            echo "ERROR: Could not automatically detect Android 17 SDK platform."
            echo
            echo "Android 17-related entries were:"
            grep -i -E \
              "cinnamon|android-37|api.?37" \
              "$SDK_LIST" \
              || true
            exit 1
          fi

          echo "platform_package=$PLATFORM_PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Detect Android 37 Build Tools
        id: buildtools
        shell: bash
        run: |
          set -e

          SDK_LIST="$RUNNER_TEMP/sdk-packages.txt"

          BUILD_TOOLS_PACKAGE="$(
            grep -E \
              '^[[:space:]]*build-tools;37\.' \
              "$SDK_LIST" \
              | sed -E 's/^[[:space:]]*//' \
              | cut -d'|' -f1 \
              | sed -E 's/[[:space:]]+$//' \
              | sort -V \
              | tail -n 1
          )"

          echo "Detected build tools:"
          echo "$BUILD_TOOLS_PACKAGE"

          if [ -z "$BUILD_TOOLS_PACKAGE" ]; then
            echo "ERROR: No Build Tools 37.x package detected."
            exit 1
          fi

          echo "build_tools_package=$BUILD_TOOLS_PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -e

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          echo "Installing platform-tools..."

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools"

          echo
          echo "Installing Android 17 platform:"
          echo "${{ steps.android17.outputs.platform_package }}"

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --channel=3 \
            "${{ steps.android17.outputs.platform_package }}"

          echo
          echo "Installing Build Tools:"
          echo "${{ steps.buildtools.outputs.build_tools_package }}"

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --channel=3 \
            "${{ steps.buildtools.outputs.build_tools_package }}"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "Installed SDK platforms:"
          find "$ANDROID_SDK_ROOT/platforms" \
            -maxdepth 2 \
            -type f \
            -name android.jar \
            -print \
            || true

          echo
          echo "Installed Build Tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools" || true

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          chmod +x gradlew

          ./gradlew --version

      - name: Show Gradle projects
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew projects \
            --no-daemon \
            --stacktrace || true

      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      - name: Build Shizuku debug APK
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find generated APKs
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project_dir }}"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          COUNT=0

          while IFS= read -r APK; do
            echo "Found APK:"
            echo "$APK"

            cp "$APK" "$GITHUB_WORKSPACE/apk-output/"

            COUNT=$((COUNT + 1))
          done < <(
            find "$PROJECT" \
              -type f \
              -name '*.apk'
          )

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: Build completed but no APK was found."
            exit 1
          fi

          echo
          echo "Collected $COUNT APK(s)."

      - name: Display APK information
        shell: bash
        run: |
          echo "APK output:"
          ls -lh "$GITHUB_WORKSPACE/apk-output"

          echo

          for APK in "$GITHUB_WORKSPACE"/apk-output/*.apk; do
            echo "--------------------------------"
            echo "$APK"
            sha256sum "$APK"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shizuku-Android17-Debug-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
