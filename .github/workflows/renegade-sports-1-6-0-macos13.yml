name: Renegade Sports 1.6.0 macOS 13 Build

on:
  push:
    branches:
      - renegade-sports-1-6-0-temp

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 20
    env:
      ANDROID_HOME: /Users/runner/work/android-sdk
      ANDROID_SDK_ROOT: /Users/runner/work/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Bundle WebView 79 compatible HLS.js
        run: |
          mkdir -p renegade_sports/app/src/main/assets
          curl -fL --retry 4 --retry-delay 2             https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js             -o renegade_sports/app/src/main/assets/hls-0.14.17.min.js
          test -s renegade_sports/app/src/main/assets/hls-0.14.17.min.js
      - name: Install Android CLI and API 37
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME"
          curl -fsSL https://dl.google.com/android/cli/latest/darwin_x86_64/install.sh | bash
          export PATH="$HOME/.android/bin:$HOME/bin:$PATH"
          ANDROID_BIN="$(command -v android || find "$HOME" -type f -name android -perm -111 2>/dev/null | head -n1)"
          "$ANDROID_BIN" --sdk="$ANDROID_HOME" sdk install platforms/android-37 build-tools/36.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Build APK
        working-directory: renegade_sports
        run: gradle --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RenegadeSports-1.6.0-debug-macos13
          path: renegade_sports/app/build/outputs/apk/debug/app-debug.apk
