name: Temporary Renegade Sports 1.3.0 macOS Build

on:
  push:
    branches:
      - renegade-sports-1-3-0-temp

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /Users/runner/work/android-sdk
      ANDROID_SDK_ROOT: /Users/runner/work/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android CLI and API 37
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME"
          if [ "$(uname -m)" = "arm64" ]; then
            CLI_URL="https://dl.google.com/android/cli/latest/darwin_arm64/install.sh"
          else
            CLI_URL="https://dl.google.com/android/cli/latest/darwin_x86_64/install.sh"
          fi
          curl -fsSL "$CLI_URL" | bash
          export PATH="$HOME/.android/bin:$HOME/bin:$PATH"
          ANDROID_BIN="$(command -v android || find "$HOME" -type f -name android -perm -111 2>/dev/null | head -n1)"
          "$ANDROID_BIN" --sdk="$ANDROID_HOME" sdk install platforms/android-37 build-tools/36.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Build APK
        working-directory: renegade_sports
        run: gradle --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RenegadeSports-1.3.0-debug-macos
          path: renegade_sports/app/build/outputs/apk/debug/app-debug.apk
