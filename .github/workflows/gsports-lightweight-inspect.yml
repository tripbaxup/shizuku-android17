name: GSports lightweight inspect

on:
  push:
    branches:
      - gsports-lightweight-inspect

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and decode event bootstrap
        run: |
          python3 - <<'PY'
          import urllib.request, zlib
          base='https://gsports.lat/event/atlanta-falcons-vs-new-orleans-saints/'
          headers={
              'User-Agent':'Mozilla/5.0 (Linux; Android 8.1; Tablet) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/79.0.3945.93 Safari/537.36',
              'Accept':'*/*'
          }
          req=urllib.request.Request(base+'?v=font.woff2', headers=headers)
          with urllib.request.urlopen(req, timeout=30) as r:
              data=bytearray(r.read())
          key=b'gs99'
          for i in range(len(data)):
              data[i] ^= key[i % len(key)]
          decoded=zlib.decompress(bytes(data), -zlib.MAX_WBITS)
          open('decoded-player.js','wb').write(decoded)
          print('encrypted bytes', len(data), 'decoded bytes', len(decoded))
          print(decoded[:4000].decode('utf-8','replace'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gsports-decoded-player
          path: decoded-player.js
